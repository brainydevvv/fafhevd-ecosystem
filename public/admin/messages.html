<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centre de Messagerie - FAFHEVD</title>
    <style>
        :root { --secondary: #f0b90b; --bg: #0b0e11; --card: #1e2329; --text: #eaecef; --text-muted: #848e9c; --border: #2b313a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR DE NAVIGATION */
        aside { 
            width: 260px; background: #161a1e; border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; position: relative; z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar-header { padding: 20px; font-weight: bold; color: var(--secondary); background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .sidebar-menu { list-style: none; padding: 15px 0; overflow-y: auto; flex-grow: 1; }
        .sidebar-menu li { padding: 12px 20px; cursor: pointer; color: var(--text-muted); font-size: 14px; transition: 0.2s; }
        .sidebar-menu li:hover, .sidebar-menu li.active { background: var(--border); color: var(--secondary); }
        
        main { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { 
            background: var(--card); padding: 15px 20px; border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; gap: 15px; 
        }
        .menu-toggle { background: none; border: none; color: white; font-size: 22px; cursor: pointer; display: none; }
        header h2 { font-size: 16px; color: white; }
        
        .chat-container { display: flex; flex-grow: 1; height: calc(100vh - 57px); overflow: hidden; position: relative; }
        
        .chat-sidebar { width: 320px; background: #161a1e; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
        .chat-item { padding: 15px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: var(--border); }
        .chat-item h4 { font-size: 14px; color: white; margin-bottom: 3px; }
        .chat-item p { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .chat-box { flex-grow: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
        .chat-header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid var(--border); font-weight: bold; font-size: 14px; color: var(--secondary); display: flex; align-items: center; gap: 10px; }
        
        /* Bouton retour conversations sur mobile */
        .back-chats-btn { background: var(--border); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; display: none; }

        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message-bubble { max-width: 75%; padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.4; word-break: break-word; }
        .message-bubble.incoming { background: var(--border); color: white; align-self: flex-start; }
        .message-bubble.outgoing { background: var(--secondary); color: #0b0e11; align-self: flex-end; font-weight: 500; }
        
        .chat-input-area { padding: 15px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .chat-input-area input { flex-grow: 1; padding: 12px; background: #0b0e11; border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 13.5px; }
        .btn-send { background: var(--secondary); color: #0b0e11; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* --- MEDIA QUERIES (RESPONSIVE) --- */
        @media (max-width: 900px) {
            aside { 
                position: fixed; left: -260px; top: 0; bottom: 0; 
                transition: transform 0.3s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            }
            aside.mobile-open { transform: translateX(260px); }
            .menu-toggle { display: block; }

            /* Bascule liste des contacts / boîte de message sur mobile */
            .chat-sidebar { width: 100%; position: absolute; height: 100%; z-index: 10; transition: transform 0.3s ease; }
            .chat-sidebar.mobile-hidden { transform: translateX(-100%); }
            .chat-box { width: 100%; }
            .back-chats-btn { display: inline-block; }
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <div class="sidebar-header">
            <span>⚡ FAFHEVD Admin</span>
            <button class="menu-toggle" onclick="toggleSidebar()" style="font-size:18px;">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li onclick="location.href='dashboard.html'">📊 Tableau de Bord & Dons</li>
            <li onclick="location.href='streaming.html'">🎥 Mini TV & Studio Direct</li>
            <li onclick="location.href='dons.html'">🎁 Campagnes & Collecte de Dons</li>
            <li class="active">💬 Messages & Support</li>
            <li onclick="location.href='avis.html'">⭐ Commentaires & Avis</li>
            <li onclick="location.href='emplois.html'">💼 Offres d'Emploi</li>
            <li onclick="localStorage.clear(); location.href='login.html'" style="color:#ef4444; margin-top:30px;">🚪 Déconnexion</li>
        </ul>
    </aside>

    <main>
        <header>
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h2>Boîte de Messagerie & Support</h2>
        </header>

        <div class="chat-container">
            <!-- Liste des conversations -->
            <div class="chat-sidebar" id="conversations-list">
                <!-- Injecté dynamiquement -->
            </div>

            <!-- Boîte de discussion active -->
            <div class="chat-box">
                <div class="chat-header" id="active-chat-header">
                    <button class="back-chats-btn" onclick="backToConversations()">← Contacts</button>
                    <span id="active-chat-title">Sélectionnez une conversation</span>
                </div>
                <div class="chat-messages" id="chat-messages-box">
                    <div style="color: var(--text-muted); text-align: center; margin-top: 50px;">Aucune conversation sélectionnée.</div>
                </div>
                <div class="chat-input-area" id="reply-area" style="display: none;">
                    <input type="text" id="reply-input" placeholder="Écrire une réponse professionnelle..." onkeypress="if(event.key === 'Enter') sendReply()">
                    <button class="btn-send" onclick="sendReply()">Envoyer</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
        }

        let currentContact = null;
        let currentContactName = null;
        let allMessages = [];

        function selectContact(contactKey, name) {
            currentContact = contactKey;
            currentContactName = name;
            document.getElementById('active-chat-title').innerText = `Discussion avec ${name}`;
            document.getElementById('reply-area').style.display = 'flex';

            // Sur mobile, cacher la liste des contacts pour afficher le chat
            if (window.innerWidth <= 900) {
                document.getElementById('conversations-list').classList.add('mobile-hidden');
            }

            const userMsgs = allMessages.filter(m => (m.contact === contactKey || m.sender === contactKey)).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const box = document.getElementById('chat-messages-box');
            box.innerHTML = userMsgs.map(m => `
                <div class="message-bubble ${m.sender_type === 'admin' ? 'outgoing' : 'incoming'}">
                    ${m.message}
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;

            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            event && event.currentTarget && event.currentTarget.classList.add('active');
        }

        function backToConversations() {
            document.getElementById('conversations-list').classList.remove('mobile-hidden');
        }

        async function loadMessages(isBackground = false) {
            try {
                const res = await fetch('/api/messages');
                allMessages = await res.json();
                
                const contactsMap = {};
                allMessages.forEach(m => {
                    const key = m.contact || m.sender;
                    if(!contactsMap[key]) {
                        contactsMap[key] = { name: m.sender, contact: key, messages: [] };
                    }
                    contactsMap[key].messages.push(m);
                });

                const listEl = document.getElementById('conversations-list');
                listEl.innerHTML = Object.keys(contactsMap).map(key => {
                    const c = contactsMap[key];
                    const lastMsg = c.messages[c.messages.length - 1];
                    return `
                        <div class="chat-item ${currentContact === key ? 'active' : ''}" onclick="selectContact('${key}', '${c.name}')">
                            <h4>${c.name}</h4>
                            <p>${lastMsg ? lastMsg.message : key}</p>
                        </div>
                    `;
                }).join('');

                if (currentContact) {
                    const userMsgs = allMessages.filter(m => (m.contact === currentContact || m.sender === currentContact)).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                    const box = document.getElementById('chat-messages-box');
                    const isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 50;

                    box.innerHTML = userMsgs.map(m => `
                        <div class="message-bubble ${m.sender_type === 'admin' ? 'outgoing' : 'incoming'}">
                            ${m.message}
                        </div>
                    `).join('');

                    if (!isBackground || isAtBottom) {
                        box.scrollTop = box.scrollHeight;
                    }
                }
            } catch (e) {
                console.error("Erreur de chargement des messages", e);
            }
        }

        async function sendReply() {
            const input = document.getElementById('reply-input');
            const text = input.value.trim();
            if(!text || !currentContact) return;

            const res = await fetch('/api/messages/repondre', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    sender: 'Admin FAFHEVD', 
                    receiver: currentContact, 
                    contact: currentContact, 
                    message: text, 
                    sender_type: 'admin' 
                })
            });
            const data = await res.json();
            if(data.success) {
                input.value = '';
                await loadMessages(false);
                if (currentContact) {
                    selectContact(currentContact, currentContactName);
                }
            }
        }

        loadMessages();

        setInterval(() => {
            loadMessages(true);
        }, 3000);
    </script>
</body>
</html>
