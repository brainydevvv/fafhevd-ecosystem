<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Centre de Messagerie - FAFHEVD</title>
    <style>
        :root { --secondary: #f0b90b; --bg: #0b0e11; --card: #1e2329; --text: #eaecef; --text-muted: #848e9c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        aside { width: 260px; background: #161a1e; border-right: 1px solid #2b313a; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: bold; color: var(--secondary); background: var(--card); border-bottom: 1px solid #2b313a; }
        .sidebar-menu { list-style: none; padding: 15px 0; }
        .sidebar-menu li { padding: 12px 20px; cursor: pointer; color: var(--text-muted); font-size: 14px; }
        .sidebar-menu li:hover, .sidebar-menu li.active { background: #2b313a; color: var(--secondary); }
        
        main { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--card); padding: 15px 30px; border-bottom: 1px solid #2b313a; }
        
        .chat-container { display: flex; flex-grow: 1; height: calc(100vh - 65px); overflow: hidden; }
        .chat-sidebar { width: 320px; background: #161a1e; border-right: 1px solid #2b313a; overflow-y: auto; }
        .chat-item { padding: 15px; border-bottom: 1px solid #2b313a; cursor: pointer; transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: #2b313a; }
        .chat-item h4 { font-size: 14px; color: white; margin-bottom: 3px; }
        .chat-item p { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .chat-box { flex-grow: 1; display: flex; flex-direction: column; background: var(--bg); }
        .chat-header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid #2b313a; font-weight: bold; font-size: 15px; color: var(--secondary); }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message-bubble { max-width: 60%; padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.4; word-break: break-word; }
        .message-bubble.incoming { background: #2b313a; color: white; align-self: flex-start; }
        .message-bubble.outgoing { background: var(--secondary); color: #0b0e11; align-self: flex-end; font-weight: 500; }
        
        .chat-input-area { padding: 15px; background: var(--card); border-top: 1px solid #2b313a; display: flex; gap: 10px; }
        .chat-input-area input { flex-grow: 1; padding: 12px; background: #0b0e11; border: 1px solid #2b313a; color: white; border-radius: 6px; }
        .btn-send { background: var(--secondary); color: #0b0e11; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <aside>
        <div class="sidebar-header">⚡ FAFHEVD Admin</div>
        <ul class="sidebar-menu">
            <li onclick="location.href='dashboard.html'">📊 Tableau de Bord & Dons</li>
            <li onclick="location.href='streaming.html'">🎥 Mini TV & Studio Direct</li>
            <li onclick="location.href='dons.html'">🎁 Campagnes & Collecte de Dons</li>
            <li class="active">💬 Messages & Support</li>
            <li onclick="location.href='avis.html'">⭐ Commentaires & Avis</li>
            <li onclick="location.href='emplois.html'">💼 Offres d'Emploi</li>
            <li onclick="localStorage.clear(); location.href='login.html'" style="color:#ef4444; margin-top:30px;">🚪 Déconnexion</li>
        </ul>
    </aside>
    <main>
        <header><h2>Boîte de Messagerie & Support</h2></header>
        <div class="chat-container">
            <div class="chat-sidebar" id="conversations-list">
                <!-- Liste des contacts injectée dynamiquement -->
            </div>
            <div class="chat-box">
                <div class="chat-header" id="active-chat-title">Sélectionnez une conversation</div>
                <div class="chat-messages" id="chat-messages-box">
                    <div style="color: var(--text-muted); text-align: center; margin-top: 50px;">Aucune conversation sélectionnée.</div>
                </div>
                <div class="chat-input-area" id="reply-area" style="display: none;">
                    <input type="text" id="reply-input" placeholder="Écrire une réponse professionnelle..." onkeypress="if(event.key === 'Enter') sendReply()">
                    <button class="btn-send" onclick="sendReply()">Envoyer</button>
                </div>
            </div>
        </div>
    </main>
    <script>
        let currentContact = null;
        let currentContactName = null;
        let allMessages = [];

        async function loadMessages(isBackground = false) {
            try {
                const res = await fetch('/api/messages');
                allMessages = await res.json();
                
                // Regroupement strict par identifiant unique (champ 'contact')
                const contactsMap = {};
                allMessages.forEach(m => {
                    const key = m.contact || m.sender;
                    if(!contactsMap[key]) {
                        contactsMap[key] = { name: m.sender, contact: key, messages: [] };
                    }
                    contactsMap[key].messages.push(m);
                });

                const listEl = document.getElementById('conversations-list');
                listEl.innerHTML = Object.keys(contactsMap).map(key => {
                    const c = contactsMap[key];
                    const lastMsg = c.messages[c.messages.length - 1];
                    return `
                        <div class="chat-item ${currentContact === key ? 'active' : ''}" onclick="selectContact('${key}', '${c.name}')">
                            <h4>${c.name}</h4>
                            <p>${lastMsg ? lastMsg.message : key}</p>
                        </div>
                    `;
                }).join('');

                // Actualisation en arrière-plan de la conversation active si ouverte
                if (currentContact) {
                    const userMsgs = allMessages.filter(m => (m.contact === currentContact || m.sender === currentContact)).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                    const box = document.getElementById('chat-messages-box');
                    const isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 50;

                    box.innerHTML = userMsgs.map(m => `
                        <div class="message-bubble ${m.sender_type === 'admin' ? 'outgoing' : 'incoming'}">
                            ${m.message}
                        </div>
                    `).join('');

                    if (!isBackground || isAtBottom) {
                        box.scrollTop = box.scrollHeight;
                    }
                }
            } catch (e) {
                console.error("Erreur de chargement des messages", e);
            }
        }

        function selectContact(contactKey, name) {
            currentContact = contactKey;
            currentContactName = name;
            document.getElementById('active-chat-title').innerText = `Discussion avec ${name} (${contactKey})`;
            document.getElementById('reply-area').style.display = 'flex';

            const userMsgs = allMessages.filter(m => (m.contact === contactKey || m.sender === contactKey)).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const box = document.getElementById('chat-messages-box');
            box.innerHTML = userMsgs.map(m => `
                <div class="message-bubble ${m.sender_type === 'admin' ? 'outgoing' : 'incoming'}">
                    ${m.message}
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;

            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            // Marquer visuellement l'élément actif
            event && event.currentTarget && event.currentTarget.classList.add('active');
        }

        async function sendReply() {
            const input = document.getElementById('reply-input');
            const text = input.value.trim();
            if(!text || !currentContact) return;

            const res = await fetch('/api/messages/repondre', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    sender: 'Admin FAFHEVD', 
                    receiver: currentContact, 
                    contact: currentContact, 
                    message: text, 
                    sender_type: 'admin' 
                })
            });
            const data = await res.json();
            if(data.success) {
                input.value = '';
                await loadMessages(false);
                if (currentContact) {
                    selectContact(currentContact, currentContactName);
                }
            }
        }

        loadMessages();

        // Actualisation automatique toutes les 3 secondes
        setInterval(() => {
            loadMessages(true);
        }, 3000);
    </script>
</body>
</html>
