<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modération des Avis - FAFHEVD</title>
    <style>
        :root { --secondary: #f0b90b; --bg: #0b0e11; --card: #1e2329; --text: #eaecef; --text-muted: #848e9c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; }
        aside { width: 260px; background: #161a1e; border-right: 1px solid #2b313a; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: bold; color: var(--secondary); background: var(--card); border-bottom: 1px solid #2b313a; }
        .sidebar-menu { list-style: none; padding: 15px 0; }
        .sidebar-menu li { padding: 12px 20px; cursor: pointer; color: var(--text-muted); font-size: 14px; }
        .sidebar-menu li:hover, .sidebar-menu li.active { background: #2b313a; color: var(--secondary); }
        main { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        header { background: var(--card); padding: 15px 30px; border-bottom: 1px solid #2b313a; }
        .content { padding: 25px; }
        .card { background: var(--card); padding: 25px; border-radius: 8px; border: 1px solid #2b313a; }
        .card h3 { color: var(--secondary); margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #2b313a; font-size: 13px; }
        table th { background: #161a1e; color: var(--text-muted); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge.approuve { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge.pending { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        .btn-action { background: #22c55e; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>
    <aside>
        <div class="sidebar-header">⚡ FAFHEVD Admin</div>
        <ul class="sidebar-menu">
            <li onclick="location.href='dashboard.html'">📊 Tableau de Bord & Dons</li>
            <li onclick="location.href='streaming.html'">🎥 Mini TV & Studio Direct</li>
            <li onclick="location.href='dons.html'">🎁 Campagnes & Collecte de Dons</li>
            <li onclick="location.href='messages.html'">💬 Messages & Support</li>
            <li class="active">⭐ Commentaires & Avis</li>
            <li onclick="location.href='emplois.html'">💼 Offres d'Emploi</li>
            <li onclick="localStorage.clear(); location.href='login.html'" style="color:#ef4444; margin-top:30px;">🚪 Déconnexion</li>
        </ul>
    </aside>
    <main>
        <header><h2>Modération des Commentaires & Avis</h2></header>
        <div class="content">
            <div class="card">
                <h3>Avis de la Communauté</h3>
                <table>
                    <thead><tr><th>Auteur</th><th>Contenu</th><th>Note</th><th>Statut</th><th>Action</th></tr></thead>
                    <tbody id="avis-table"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script>
        async function loadAvis() {
            const res = await fetch('/api/commentaires');
            const data = await res.json();
            document.getElementById('avis-table').innerHTML = data.map(c => `
                <tr>
                    <td><b>${c.auteur}</b></td>
                    <td>${c.contenu}</td>
                    <td>${c.note || '-'}/5</td>
                    <td><span class="badge ${c.statut === 'approuve' ? 'approuve' : 'pending'}">${c.statut || 'pending'}</span></td>
                    <td><button class="btn-action" onclick="approuver(${c.id})">Approuver</button></td>
                </tr>
            `).join('');
        }
        async function approuver(id) {
            await fetch('/api/commentaires/statut', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id, statut: 'approuve' }) });
            loadAvis();
        }
        loadAvis();
    </script>
</body>
</html>
